<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="t d"><title id="t">Detection engineering lifecycle</title><desc id="d">Animated pipeline: Ingest (log-source onboarding) -&gt; Parse (custom parsers) -&gt; Detect (Sigma, IOAs, correlation rules) -&gt; Triage (L2/L3, MITRE ATT&amp;CK mapping) -&gt; Respond (contain, eradicate, recover) -&gt; Learn (RCA, tuning), with a feedback loop from Learn back to Detect.</desc><style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Inter,'Helvetica Neue',Arial,sans-serif}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes hold{0%,99%{opacity:0}100%{opacity:1}}
@keyframes f0{0%,33%{opacity:1}33.1%,100%{opacity:0}}
@keyframes f1{0%,33%{opacity:0}33.1%,66%{opacity:1}66.1%,100%{opacity:0}}
@keyframes f2{0%,66%{opacity:0}66.1%,99.9%{opacity:1}100%{opacity:0}}
.blink{animation:blink 1.05s step-end infinite}
.pulse{animation:pulse 1.8s ease-in-out infinite}

.flow{stroke-dasharray:6 12;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-18}}
.loop{stroke-dasharray:5 9;animation:loopf 1.4s linear infinite}
@keyframes loopf{to{stroke-dashoffset:-14}}
.pk{animation:pk 6.0s linear infinite}
@keyframes pk{0%{transform:translateX(0);opacity:0}3%{opacity:1}97%{opacity:1}100%{transform:translateX(960px);opacity:0}}
.glow{animation:glow 2.0s linear infinite}
@keyframes glow{0%{opacity:1}45%{opacity:0}100%{opacity:0}}
.node{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-labelledby="t d"><title id="t">footer</title><desc id="d">A heartbeat line above the motto 'detect early  ·  respond fast  ·  learn always'.</desc><style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Inter,'Helvetica Neue',Arial,sans-serif}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes hold{0%,99%{opacity:0}100%{opacity:1}}
@keyframes f0{0%,33%{opacity:1}33.1%,100%{opacity:0}}
@keyframes f1{0%,33%{opacity:0}33.1%,66%{opacity:1}66.1%,100%{opacity:0}}
@keyframes f2{0%,66%{opacity:0}66.1%,99.9%{opacity:1}100%{opacity:0}}
.blink{animation:blink 1.05s step-end infinite}
.pulse{animation:pulse 1.8s ease-in-out infinite}

.trace{stroke-dasharray:220 1965.51;animation:ecg 3.8s linear infinite}
@keyframes ecg{from{stroke-dashoffset:220}to{stroke-dashoffset:-1745.51}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
